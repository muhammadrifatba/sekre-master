[project]
name = "sekre-master-profiler-backend"
version = "2.0.0"
description = "Supabase-backed omni-channel Customer Master Profiler & Ticket MCP Bridge for PT Nusantara Alat Berat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "mcp>=1.0,<2",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "uvicorn>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
